<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YOLLA Visual Analyzer Wave 1</title>
<link rel="stylesheet" href="./visual_analyzer.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">YOLLA Visual Analyzer</div>
  <div class="url-box"><input id="browser-url" value="./fixtures/listing_page.html" aria-label="브라우저 URL"><button id="open-url" class="button">열기</button></div>
  <button id="picker-toggle" class="button">Element Picker</button>
  <span id="mode-badge" class="mode-badge">DOM</span>
</header>
<main class="workspace">
  <section class="browser-panel">
    <div class="panel-title"><span>Live Browser Pane</span><div class="highlight-legend"><span class="legend"><i class="dot repeat"></i>반복영역</span><span class="legend"><i class="dot field"></i>필드</span><span class="legend"><i class="dot pagination"></i>Pagination</span></div></div>
    <iframe id="live-browser-frame" class="browser-frame" src="../fixtures/listing_page.html" title="Live Browser Pane"></iframe>
  </section>
  <section class="side-panel">
    <nav class="tabs"><button class="tab active" data-tab="inspector">Smart Inspector</button><button class="tab" data-tab="workflow">Workflow View</button></nav>
    <div>
      <section id="tab-inspector" class="tab-pane active"><div id="selection-card" class="selection-card"><div class="empty">Element Picker로 요소를 선택하십시오.</div></div><div id="candidate-list"></div><div id="field-editor"></div><button id="apply-fields" class="button primary">Apply</button></section>
      <section id="tab-workflow" class="tab-pane"><div id="workflow-list"></div></section>
    </div>
    <div class="preview-wrap"><div class="preview-header"><strong>Data Preview</strong><span id="preview-status" class="status-line"></span></div><div id="preview-table"></div></div>
  </section>
</main>
</div>
<script type="module" src="../src/visual_analyzer_app.js"></script>
</body>
</html>

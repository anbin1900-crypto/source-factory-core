<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOLLA Command Workspace</title>
  <link rel="stylesheet" href="./yolla_worker_shell.css">
</head>
<body>
  <header class="yw-header">
    <div class="yw-window-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="yw-header-title">
      <strong>YOLLA COMMAND WORKSPACE</strong>
      <span id="yw-selected-role">A-1</span>
    </div>
    <div class="yw-header-cycle">
      <span>명령 순환</span>
      <strong id="yw-cycle-status">대기</strong>
    </div>
  </header>

  <aside class="yw-sidebar" aria-label="커맨더와 워커 그룹">
    <div class="yw-brand">
      <span>욜라 학습 DB</span>
      <strong>커맨더·워커 그룹</strong>
      <small>그룹 탭을 선택하고 워커를 관리합니다.</small>
    </div>

    <div class="yw-tabs-shell">
      <nav id="yw-group-tabs" class="yw-group-tabs" aria-label="그룹 탭" role="tablist"></nav>
    </div>

    <section class="yw-group-toolbar" aria-label="활성 그룹 도구">
      <div class="yw-active-group-copy">
        <span id="yw-active-group-color" class="yw-color-dot" aria-hidden="true"></span>
        <strong id="yw-active-group-title">그룹</strong>
        <small id="yw-active-group-count">0명</small>
      </div>
      <div class="yw-group-actions">
        <button id="yw-edit-group" class="yw-icon-button" type="button" title="그룹 이름·색상 변경" aria-label="그룹 편집">✎</button>
        <button id="yw-add-worker" class="yw-primary-button" type="button">+ 워커</button>
      </div>
    </section>

    <nav id="yw-role-groups" class="yw-role-groups" aria-label="활성 그룹 역할"></nav>

    <section class="yw-cycle-card" aria-live="polite">
      <div class="yw-cycle-card-title">
        <strong>최근 1회 순환</strong>
        <span id="yw-cycle-id">없음</span>
      </div>
      <ol id="yw-cycle-events" class="yw-cycle-events">
        <li>패널에서 명령을 실행하면 여기에 순환 단계가 표시됩니다.</li>
      </ol>
    </section>
  </aside>

  <main class="yw-browser-placeholder" aria-hidden="true">
    <span>ChatGPT BrowserView 연결 영역</span>
  </main>

  <dialog id="yw-group-dialog" class="yw-dialog">
    <form method="dialog" id="yw-group-form">
      <div class="yw-dialog-head">
        <div><small>GROUP SETTINGS</small><strong>그룹 편집</strong></div>
        <button type="button" class="yw-dialog-close" data-dialog-close="yw-group-dialog" aria-label="닫기">×</button>
      </div>
      <label>그룹 명칭<input id="yw-group-name" maxlength="60" required></label>
      <label>그룹 색상<span class="yw-color-field"><input id="yw-group-color" type="color" value="#64748b"><input id="yw-group-color-text" maxlength="7" pattern="#[0-9A-Fa-f]{6}" value="#64748b"></span></label>
      <div class="yw-dialog-actions"><button type="button" data-dialog-close="yw-group-dialog">취소</button><button class="yw-primary-button" type="submit">저장</button></div>
    </form>
  </dialog>

  <dialog id="yw-worker-dialog" class="yw-dialog">
    <form method="dialog" id="yw-worker-form">
      <div class="yw-dialog-head">
        <div><small>NEW WORKER</small><strong>워커 추가</strong></div>
        <button type="button" class="yw-dialog-close" data-dialog-close="yw-worker-dialog" aria-label="닫기">×</button>
      </div>
      <label>워커 표시명<input id="yw-worker-name" maxlength="80" placeholder="예: 법률자료 수집 워커" required></label>
      <label>워커 ID <small>비워두면 자동 생성</small><input id="yw-worker-id" maxlength="64" placeholder="예: A-8"></label>
      <label>프로젝트 URL <small>선택사항</small><input id="yw-worker-project-url" type="url" placeholder="https://chatgpt.com/g/.../project"></label>
      <label>현재 대화 URL <small>선택사항</small><input id="yw-worker-context-url" type="url" placeholder="https://chatgpt.com/c/..."></label>
      <div class="yw-dialog-actions"><button type="button" data-dialog-close="yw-worker-dialog">취소</button><button class="yw-primary-button" type="submit">워커 추가</button></div>
    </form>
  </dialog>

  <div id="yw-toast" class="yw-toast" role="status" aria-live="polite"></div>
  <script src="./yolla_worker_shell.js"></script>
</body>
</html>

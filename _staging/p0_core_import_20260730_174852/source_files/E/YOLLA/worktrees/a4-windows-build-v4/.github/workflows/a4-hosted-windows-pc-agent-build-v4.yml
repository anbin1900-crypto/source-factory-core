name: A4 Hosted Windows PC Agent Build V4

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/a4-hosted-windows-pc-agent-build-v4.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a4-hosted-windows-pc-agent-build-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-win-x64:
    name: Build installable PC Agent Windows Service
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PACKET_ROOT: s1/ship-now/wkr-004-install-restart/wave3_windows_service_bundle_v3
      OUTPUT_ROOT: ${{ github.workspace }}\a4-hosted-build-output-v4
      ARTIFACT_NAME: a4-pc-agent-windows-service-win-x64-v4
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch exact upstream branch history
        shell: pwsh
        run: |
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"
          if ($LASTEXITCODE -ne 0) { throw "A4WSV4001_GIT_FETCH_FAILED:$LASTEXITCODE" }
          git rev-parse HEAD
          git status --short

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Validate source packet contracts
        shell: pwsh
        run: |
          $packet = Join-Path $env:GITHUB_WORKSPACE $env:PACKET_ROOT
          python (Join-Path $packet "tools\validate_source_packet_v3.py") --root $packet
          if ($LASTEXITCODE -ne 0) { throw "A4WSV4002_SOURCE_PACKET_VALIDATION_FAILED:$LASTEXITCODE" }
          python -m unittest discover -s (Join-Path $packet "tests") -v
          if ($LASTEXITCODE -ne 0) { throw "A4WSV4003_SOURCE_PACKET_TESTS_FAILED:$LASTEXITCODE" }

      - name: Parse PowerShell sources with native AST
        shell: pwsh
        run: |
          $packet = Join-Path $env:GITHUB_WORKSPACE $env:PACKET_ROOT
          $paths = @(
            (Join-Path $packet "BUILD_PC_AGENT_WINDOWS_SERVICE_BUNDLE_V3.ps1"),
            (Join-Path $packet "scripts\INSTALL_PC_AGENT_SERVICE_V3.ps1"),
            (Join-Path $packet "scripts\Invoke-PC_AGENT_SERVICE_V3.ps1")
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "A4WSV4004_POWERSHELL_AST_FAILED:$path:$($errors.Message -join ';')"
            }
          }
          "PASS_NATIVE_AST_3_OF_3"

      - name: Build actual win-x64 installable bundle
        shell: pwsh
        run: |
          $packet = Join-Path $env:GITHUB_WORKSPACE $env:PACKET_ROOT
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_ROOT | Out-Null
          & (Join-Path $packet "BUILD_PC_AGENT_WINDOWS_SERVICE_BUNDLE_V3.ps1") `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -OutputRoot $env:OUTPUT_ROOT `
            -PythonExe "python.exe" `
            -ConfirmNonProduction 2>&1 | Tee-Object -FilePath (Join-Path $env:OUTPUT_ROOT "HOSTED_WINDOWS_BUILD_LOG_V4.txt")
          if ($LASTEXITCODE -ne 0) { throw "A4WSV4005_WINDOWS_BUILD_SCRIPT_FAILED:$LASTEXITCODE" }

      - name: Verify artifact and write hosted manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Sha([string]$Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          $zip = Join-Path $env:OUTPUT_ROOT "YOLLA_PC_AGENT_WINDOWS_SERVICE_WIN_X64_V3.zip"
          $profile = Join-Path $env:OUTPUT_ROOT "A4_PC_AGENT_WINDOWS_SERVICE_PROFILE_V3.json"
          $receipt = Join-Path $env:OUTPUT_ROOT "WINDOWS_SERVICE_BUILD_RECEIPT_V3.json"
          foreach ($path in @($zip, $profile, $receipt)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "A4WSV4006_REQUIRED_OUTPUT_MISSING:$path" }
          }
          $expanded = Join-Path $env:RUNNER_TEMP "a4-hosted-artifact-readback-v4"
          if (Test-Path -LiteralPath $expanded) { Remove-Item -LiteralPath $expanded -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded -Force
          $installManifestPath = Join-Path $expanded "INSTALLABLE_BUNDLE_MANIFEST.json"
          if (-not (Test-Path -LiteralPath $installManifestPath)) { throw "A4WSV4007_INSTALLABLE_MANIFEST_MISSING" }
          $installManifest = Get-Content -LiteralPath $installManifestPath -Raw | ConvertFrom-Json
          if ($installManifest.bundle_id -ne "YOLLA_PC_AGENT_WINDOWS_SERVICE_WIN_X64_V3") { throw "A4WSV4008_BUNDLE_ID_MISMATCH" }
          if ($installManifest.service_name -ne "YOLLA-PC-AGENT") { throw "A4WSV4009_SERVICE_IDENTITY_MISMATCH" }
          if ($installManifest.runtime_identifier -ne "win-x64" -or $installManifest.target_framework -ne "net8.0-windows") { throw "A4WSV4010_TARGET_MISMATCH" }
          $requiredCoordinates = @(
            "scripts/INSTALL_PC_AGENT_SERVICE_V3.ps1",
            "scripts/Invoke-PC_AGENT_SERVICE_V3.ps1",
            "executor/INSTALL_RESTART_ROLLBACK_EXECUTOR_V1.ps1",
            "payload/bin/YollaPcAgentServiceHost.exe"
          )
          $paths = @($installManifest.files | ForEach-Object { [string]$_.path })
          foreach ($required in $requiredCoordinates) {
            if ($required -notin $paths) { throw "A4WSV4011_COORDINATE_MISSING:$required" }
          }
          foreach ($entry in $installManifest.files) {
            $path = Join-Path $expanded ([string]$entry.path -replace "/", "\")
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "A4WSV4012_MANIFEST_FILE_MISSING:$($entry.path)" }
            $observed = Sha $path
            if ($observed -ne [string]$entry.sha256) { throw "A4WSV4013_MANIFEST_SHA_MISMATCH:$($entry.path):$observed:$($entry.sha256)" }
          }
          $binaryPath = Join-Path $expanded "payload\bin\YollaPcAgentServiceHost.exe"
          $binarySha = Sha $binaryPath
          if ($binarySha -ne [string]$installManifest.binary_sha256) { throw "A4WSV4014_BINARY_SHA_MISMATCH:$binarySha:$($installManifest.binary_sha256)" }
          Copy-Item -LiteralPath $installManifestPath -Destination (Join-Path $env:OUTPUT_ROOT "INSTALLABLE_BUNDLE_MANIFEST.json") -Force
          $hosted = [ordered]@{
            schema_version = "S1_WKR004_HOSTED_WINDOWS_BUILD_MANIFEST_V4"
            wave_id = "S1-ABC18-WAVE4-RELEASE-CONVERGENCE-V1-20260730-001"
            directive_id = "S1-TO-A4-GITHUB-HOSTED-WINDOWS-BUILD-ARTIFACT-V4-20260730-001"
            worker_uid = "WKR-004"
            target_pr = 177
            run_id = $env:GITHUB_RUN_ID
            run_number = $env:GITHUB_RUN_NUMBER
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            workflow = $env:GITHUB_WORKFLOW
            job = $env:GITHUB_JOB
            commit_sha = $env:GITHUB_SHA
            event_name = $env:GITHUB_EVENT_NAME
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            artifact_name = $env:ARTIFACT_NAME
            artifact_file = Split-Path -Leaf $zip
            artifact_sha256 = Sha $zip
            artifact_size_bytes = (Get-Item -LiteralPath $zip).Length
            target_framework = [string]$installManifest.target_framework
            runtime_identifier = [string]$installManifest.runtime_identifier
            self_contained = [bool]$installManifest.self_contained
            publish_single_file = [bool]$installManifest.publish_single_file
            service_identity = [ordered]@{
              service_name = [string]$installManifest.service_name
              binary_relative_path = "payload/bin/YollaPcAgentServiceHost.exe"
              binary_sha256 = $binarySha
              installer = "scripts/INSTALL_PC_AGENT_SERVICE_V3.ps1"
              lifecycle = "scripts/Invoke-PC_AGENT_SERVICE_V3.ps1"
              uninstaller_action = "Uninstall"
              health_actions = @("Health15", "Health120")
              restart_action = "Restart"
              rollback_action = "Rollback"
            }
            build_log = "HOSTED_WINDOWS_BUILD_LOG_V4.txt"
            installable_manifest = "INSTALLABLE_BUNDLE_MANIFEST.json"
            build_receipt = "WINDOWS_SERVICE_BUILD_RECEIPT_V3.json"
            execution_profile = "A4_PC_AGENT_WINDOWS_SERVICE_PROFILE_V3.json"
            target_pc_install_performed = $false
            production_side_effect_count = 0
            ready_transition_count = 0
            self_merge = $false
          }
          $hosted | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $env:OUTPUT_ROOT "HOSTED_WINDOWS_BUILD_MANIFEST_V4.json") -Encoding UTF8
          Get-ChildItem -LiteralPath $env:OUTPUT_ROOT -File | ForEach-Object { "OUTPUT=$($_.Name) SHA256=$(Sha $_.FullName) SIZE=$($_.Length)" }

      - name: Upload installable Windows service artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUTPUT_ROOT }}\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish run summary
        shell: pwsh
        run: |
          @"
          ## A-4 Hosted Windows Build V4
          - Run ID: $env:GITHUB_RUN_ID
          - Job: $env:GITHUB_JOB
          - Commit: $env:GITHUB_SHA
          - Artifact name: $env:ARTIFACT_NAME
          - Artifact ID: ${{ steps.upload.outputs.artifact-id }}
          - Artifact URL: ${{ steps.upload.outputs.artifact-url }}
          - Target PC install: not performed
          - Production / Ready / Self merge: false
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

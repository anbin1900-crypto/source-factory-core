name: tmp-p19-epeople-fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-p19-epeople-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe official ePeople SOAP read operations
        shell: bash
        run: |
          set -euxo pipefail
          out="$RUNNER_TEMP/p19-epeople-soap-probe"
          mkdir -p "$out"
          python - <<'PY'
          import hashlib, json, os, pathlib, ssl, urllib.error, urllib.request, uuid
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'p19-epeople-soap-probe'
          endpoint='https://api.epeople.go.kr/soap/CivilAppealService'
          def envelope(key='', qualified_children=False, include_header=True):
              p='q:' if qualified_children else ''
              h=''
              if include_header:
                  h=f'''<soapenv:Header><hdr:ComMsgHeader><RequestMsgID>{uuid.uuid4()}</RequestMsgID><ServiceKey>{key}</ServiceKey><RequestTime>20260825051000</RequestTime></hdr:ComMsgHeader></soapenv:Header>'''
              return f'''<?xml version="1.0" encoding="UTF-8"?>
          <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/" xmlns:q="http://soap.civil.pc.acrc/" xmlns:hdr="http://apache.org/headers">
          {h}<soapenv:Body><q:getSimilarityCaseList><{p}CaseListRequest><{p}nowPageNo>1</{p}nowPageNo><{p}pageMg>10</{p}pageMg><{p}title>주유소</{p}title><{p}content>주유소</{p}content></{p}CaseListRequest></q:getSimilarityCaseList></soapenv:Body></soapenv:Envelope>'''.encode('utf-8')
          variants=[
            ('empty_unqualified',envelope('',False,True)),
            ('empty_qualified',envelope('',True,True)),
            ('test_unqualified',envelope('TEST',False,True)),
            ('no_header',envelope('',False,False)),
          ]
          manifest=[]; ctx=ssl.create_default_context()
          for name,body in variants:
              req=urllib.request.Request(endpoint,data=body,method='POST',headers={'Content-Type':'text/xml; charset=UTF-8','SOAPAction':'','User-Agent':'P19ActualSourceResearch/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=35,context=ctx) as r:
                      data=r.read(); status=r.status; ctype=r.headers.get('content-type')
              except urllib.error.HTTPError as e:
                  data=e.read(); status=e.code; ctype=e.headers.get('content-type') if e.headers else None
              except Exception as e:
                  manifest.append({'name':name,'error':repr(e)}); continue
              (out/f'{name}_request.xml').write_bytes(body)
              (out/f'{name}_response.xml').write_bytes(data)
              manifest.append({'name':name,'status':status,'content_type':ctype,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Upload SOAP probe responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p19-epeople-soap-probe
          path: ${{ runner.temp }}/p19-epeople-soap-probe
          if-no-files-found: warn
          retention-days: 1

name: tmp-p19-epeople-fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-p19-epeople-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official ePeople API guide and examples
        shell: bash
        run: |
          set -euxo pipefail
          out="$RUNNER_TEMP/p19-epeople-api-guide"
          mkdir -p "$out"
          python - <<'PY'
          import hashlib, json, os, pathlib, re, ssl, time, urllib.parse, urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'p19-epeople-api-guide'
          starts=['https://api.epeople.go.kr/guide/','http://api.epeople.go.kr/guide/','https://api.epeople.go.kr/']
          queue=[(u,0) for u in starts]; seen=set(); manifest=[]; ctx=ssl.create_default_context()
          def fetch(url):
              last=None
              for n in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; P19ActualSourceResearch/1.0)','Accept':'text/html,application/javascript,text/css,application/json,text/plain,*/*'})
                      with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                          return r.geturl(),r.status,r.headers.get('content-type',''),r.read()
                  except Exception as e: last=e; time.sleep(n+1)
              raise last
          while queue and len(seen)<80:
              url,depth=queue.pop(0)
              if url in seen: continue
              seen.add(url)
              try:
                  final,status,ctype,data=fetch(url)
                  ext='.html'
                  if 'javascript' in ctype or urllib.parse.urlparse(final).path.endswith('.js'): ext='.js'
                  elif 'css' in ctype or urllib.parse.urlparse(final).path.endswith('.css'): ext='.css'
                  elif 'json' in ctype: ext='.json'
                  name=f'{len(manifest):03d}_'+hashlib.sha256(url.encode()).hexdigest()[:12]+ext
                  (out/name).write_bytes(data)
                  rec={'url':url,'final_url':final,'status':status,'content_type':ctype,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'file':name}
                  text=data.decode('utf-8','ignore')
                  rec['matches']={k:len(re.findall(k,text,re.I)) for k in ['ServiceKey','getSimilarityCaseList','CivilAppealService','service.?key','인증키','활용신청','키발급']}
                  links=[]
                  if depth<2 and ('html' in ctype or ext=='.html'):
                      for v in re.findall(r'''(?:href|src)=["']([^"'#]+)''',text,re.I):
                          nxt=urllib.parse.urljoin(final,v)
                          p=urllib.parse.urlparse(nxt)
                          if p.hostname=='api.epeople.go.kr' and ('/guide' in p.path or p.path.endswith(('.js','.css','.json','.do','.action','.html','.jsp'))):
                              links.append(nxt)
                              if nxt not in seen: queue.append((nxt,depth+1))
                  rec['links']=links
                  manifest.append(rec)
              except Exception as e: manifest.append({'url':url,'error':repr(e)})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          searchable=[]
          for p in out.iterdir():
              if p.suffix in ('.html','.js','.css','.json'):
                  t=p.read_text(encoding='utf-8',errors='ignore')
                  for pat in ('ServiceKey','getSimilarityCaseList','CivilAppealService','인증키','활용신청','발급'):
                      for m in re.finditer(pat,t,re.I): searchable.append({'file':p.name,'pattern':pat,'snippet':t[max(0,m.start()-300):m.end()+500]})
          (out/'matches.json').write_text(json.dumps(searchable,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          print('MATCH_COUNT',len(searchable))
          PY
      - name: Upload API guide files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p19-epeople-api-guide
          path: ${{ runner.temp }}/p19-epeople-api-guide
          if-no-files-found: warn
          retention-days: 1

name: tmp-p19-epeople-fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-p19-epeople-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Recursively fetch official ePeople SOAP WSDL and XSD
        shell: bash
        run: |
          set -euxo pipefail
          out="$RUNNER_TEMP/p19-epeople-soap"
          mkdir -p "$out"
          python - <<'PY'
          import hashlib, json, os, pathlib, ssl, time, urllib.parse, urllib.request
          import xml.etree.ElementTree as ET

          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'p19-epeople-soap'
          start='https://api.epeople.go.kr/soap/CivilAppealService?wsdl='
          queue=[start]
          seen=set()
          manifest=[]
          ctx=ssl.create_default_context()
          def fetch(url):
              last=None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; P19ActualSourceResearch/1.0)','Accept':'text/xml,application/xml,*/*'})
                      with urllib.request.urlopen(req,timeout=45,context=ctx) as r:
                          return r.status,r.headers.get('content-type'),r.read()
                  except Exception as e:
                      last=e; time.sleep(2*(attempt+1))
              raise last
          while queue:
              url=queue.pop(0)
              if url in seen: continue
              seen.add(url)
              try:
                  status,ctype,data=fetch(url)
                  name=f'{len(manifest):03d}_'+hashlib.sha256(url.encode()).hexdigest()[:12]+'.xml'
                  (out/name).write_bytes(data)
                  rec={'url':url,'status':status,'content_type':ctype,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'file':name}
                  try:
                      root=ET.fromstring(data)
                      links=[]
                      for el in root.iter():
                          for attr in ('location','schemaLocation'):
                              v=el.attrib.get(attr)
                              if v:
                                  nxt=urllib.parse.urljoin(url,v)
                                  links.append(nxt)
                                  if nxt not in seen: queue.append(nxt)
                      rec['imports']=links
                  except Exception as e:
                      rec['parse_error']=repr(e)
                  manifest.append(rec)
              except Exception as e:
                  manifest.append({'url':url,'error':repr(e)})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
          find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n'
      - name: Upload official SOAP descriptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p19-epeople-soap-schema
          path: ${{ runner.temp }}/p19-epeople-soap
          if-no-files-found: warn
          retention-days: 1

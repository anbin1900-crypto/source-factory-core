name: tmp-p19-epeople-fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-p19-epeople-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch targeted official ePeople SOAP descriptions
        shell: bash
        run: |
          set -euxo pipefail
          out="$RUNNER_TEMP/p19-epeople-soap-targeted"
          mkdir -p "$out"
          python - <<'PY'
          import hashlib, json, os, pathlib, ssl, urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'p19-epeople-soap-targeted'
          base='https://api.epeople.go.kr/soap/CivilAppealService'
          urls=[base+'?wsdl=',base+'?wsdl=CivilAppealEndpoint.wsdl']+[base+f'?xsd={i}' for i in range(1,13)]
          manifest=[]
          ctx=ssl.create_default_context()
          for i,url in enumerate(urls):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; P19ActualSourceResearch/1.0)','Accept':'text/xml,application/xml,*/*'})
                  with urllib.request.urlopen(req,timeout=20,context=ctx) as r:
                      data=r.read(); name=f'{i:02d}.xml'; (out/name).write_bytes(data)
                      manifest.append({'url':url,'status':r.status,'content_type':r.headers.get('content-type'),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'file':name})
              except Exception as e:
                  manifest.append({'url':url,'error':repr(e)})
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False,indent=2))
          PY
      - name: Upload targeted SOAP descriptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p19-epeople-soap-targeted
          path: ${{ runner.temp }}/p19-epeople-soap-targeted
          if-no-files-found: warn
          retention-days: 1

name: tmp-p19-epeople-fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-p19-epeople-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe ePeople through public document reader
        shell: bash
        run: |
          set -euxo pipefail
          out="$RUNNER_TEMP/p19-epeople-reader-probe"; mkdir -p "$out"
          python - <<'PY'
          import hashlib,json,os,pathlib,ssl,urllib.parse,urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'p19-epeople-reader-probe'
          base='https://www.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseList.npaid'
          params={'recordCountPerPage':'100','pageIndex':'1','searchOptionClickYn':'Y','searchWordType':'0','searchWord':'주유소','rqstStDt':'2020-01-01','rqstEndDt':'2026-08-25','dateType':'6','pttnTypeNm':'','searchInstCd':'all'}
          search=base+'?'+urllib.parse.urlencode(params)
          detail='https://www.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseDetail.npaid?dutySctnNm=tqapttn&epUnionSn=6903173'
          targets={
            'reader_list_https':'https://r.jina.ai/https://www.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseList.npaid',
            'reader_list_http':'https://r.jina.ai/http://www.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseList.npaid',
            'reader_search_https':'https://r.jina.ai/'+search,
            'reader_detail_https':'https://r.jina.ai/'+detail,
            'reader_detail_http':'https://r.jina.ai/http://www.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseDetail.npaid?dutySctnNm=tqapttn&epUnionSn=6903173',
          }
          ctx=ssl.create_default_context(); result={}
          for name,url in targets.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/plain,text/markdown,*/*'})
                  with urllib.request.urlopen(req,timeout=60,context=ctx) as r: data=r.read(); status=r.status; ctype=r.headers.get('content-type')
                  (out/f'{name}.txt').write_bytes(data)
                  result[name]={'url':url,'status':status,'content_type':ctype,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'prefix':data[:1000].decode('utf-8','replace')}
              except Exception as e: result[name]={'url':url,'error':repr(e)}
          (out/'results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8'); print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload reader probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p19-epeople-reader-probe
          path: ${{ runner.temp }}/p19-epeople-reader-probe
          retention-days: 1

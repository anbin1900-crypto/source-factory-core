name: tmp-p19-epeople-fetch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-p19-epeople-fetch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Directly fetch official ePeople search HTML
        shell: bash
        env:
          ATTEMPT: ${{ matrix.attempt }}
        run: |
          set -u
          out="$RUNNER_TEMP/p19-epeople-direct-$ATTEMPT"; mkdir -p "$out"
          python - <<'PY'
          import hashlib, html, json, os, pathlib, re, socket, ssl, subprocess, urllib.parse, urllib.request
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/('p19-epeople-direct-'+os.environ['ATTEMPT'])
          params={'recordCountPerPage':'100','pageIndex':'1','searchOptionClickYn':'Y','searchWordType':'0','searchWord':'주유소','rqstStDt':'2020-01-01','rqstEndDt':'2026-08-25','dateType':'6','pttnTypeNm':'','searchInstCd':'all'}
          query=urllib.parse.urlencode(params)
          urls=[
            'https://www.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseList.npaid?'+query,
            'http://www.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseList.npaid?'+query,
            'https://wwwdev.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseList.npaid?'+query,
            'http://wwwdev.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseList.npaid?'+query,
          ]
          result={'attempt':os.environ['ATTEMPT'],'runner':os.environ.get('RUNNER_NAME'),'urls':[],'dns':{}}
          for host in ('www.epeople.go.kr','wwwdev.epeople.go.kr','api.epeople.go.kr'):
              try: result['dns'][host]=sorted({x[4][0] for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
              except Exception as e: result['dns'][host]=repr(e)
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8','Accept-Language':'ko-KR,ko;q=0.9,en;q=0.5','Cache-Control':'no-cache','Pragma':'no-cache'}
          ctx=ssl.create_default_context()
          for i,url in enumerate(urls):
              rec={'url':url}
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=25,context=ctx) as r: data=r.read(); rec.update(status=r.status,final_url=r.geturl(),content_type=r.headers.get('content-type'),bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                  (out/f'{i}.html').write_bytes(data)
                  text=data.decode('utf-8','replace'); rows=[]
                  for m in re.finditer(r"fn_detail\(this,'([^']+)','([^']+)'\)",text):
                      a0=text.rfind('<a',0,m.start()); a1=text.find('</a>',m.end()); inner=text[text.find('>',a0)+1:a1] if a0>=0 and a1>=0 else ''
                      title=html.unescape(re.sub(r'<[^>]+>',' ',inner)); title=re.sub(r'\s+',' ',title).strip()
                      rows.append({'id':m.group(1),'type':m.group(2),'title':title})
                  rec['rows']=rows; rec['fn_detail_count']=text.count('fn_detail')
              except Exception as e: rec['error']=repr(e)
              result['urls'].append(rec)
          (out/'results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Upload direct fetch attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p19-epeople-direct-${{ matrix.attempt }}
          path: ${{ runner.temp }}/p19-epeople-direct-${{ matrix.attempt }}
          if-no-files-found: warn
          retention-days: 1

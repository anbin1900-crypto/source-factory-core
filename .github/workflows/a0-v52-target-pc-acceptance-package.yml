name: A0 V5.2 Target PC Acceptance Package

on:
  pull_request:
    paths:
      - 'yolla-panel-v1/a0-successor-control/target-pc-v52/**'
      - '.github/workflows/a0-v52-target-pc-acceptance-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: yolla-panel-v1/a0-successor-control/target-pc-v52
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse JSON and compile Python
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool A0_V52_EXACT_INSTALLER_AUTHORITY_RESOLUTION_V1.json >/dev/null
          python -m json.tool A0_V52_OPERATOR_OBSERVATION_TEMPLATE_V1.json >/dev/null
          python -m py_compile \
            validate_a0_v52_exact_installer_execution.py \
            test_a0_v52_exact_installer_execution.py
          echo A0_V52_JSON_AND_PYTHON_PARSE=PASS
      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          python validate_a0_v52_exact_installer_execution.py --root . --output /tmp/a0-v52-validation.json
          cat /tmp/a0-v52-validation.json
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_a0_v52_exact_installer_execution.py
      - name: Record safety boundary
        shell: bash
        run: |
          printf '%s\n' \
            'TARGET_PC_EXECUTION_COUNT=0' \
            'TARGET_PC_PASS_CLAIMED=false' \
            'PRODUCTION=false' \
            'READY=false' \
            'MERGE=false'

  validate-windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse exact installer execution runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSEdition-ne'Desktop'-or$PSVersionTable.PSVersion.Major-ne5-or$PSVersionTable.PSVersion.Minor-ne1){
            throw ('WINDOWS_POWERSHELL_51_REQUIRED actual=' + $PSVersionTable.PSVersion)
          }
          $path='yolla-panel-v1/a0-successor-control/target-pc-v52/Invoke-A0V52ExactInstallerExecution.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count-ne0){
            throw ('A0_V52_RUNNER_PARSE_FAILED count=' + $errors.Count + ' first=' + $errors[0].Message)
          }
          'A0_V52_WINDOWS_POWERSHELL_51_PARSE=PASS'
          'TARGET_PC_EXECUTION_COUNT=0'
          'TARGET_PC_PASS_CLAIMED=false'
          'PRODUCTION=false'
          'READY=false'
          'MERGE=false'

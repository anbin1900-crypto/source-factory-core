name: Validate YOLLA Chrome Group Tabs V5.3

on:
  push:
    branches:
      - integration/a0-yolla-workspace-automation-successor-v1
    paths:
      - 'yolla-panel-v1/a0-successor-control/ui-v53/yolla_panel_main_bridge.cjs.gz.b64'
      - 'yolla-panel-v1/a1-connection-frontier/yolla_panel_main_bridge.cjs'
      - 'yolla-panel-v1/a1-connection-frontier/yolla_worker_preload.js'
      - 'yolla-panel-v1/a1-connection-frontier/yolla_worker_shell.html'
      - 'yolla-panel-v1/a1-connection-frontier/yolla_worker_shell.css'
      - 'yolla-panel-v1/a1-connection-frontier/yolla_worker_shell.js'
      - 'yolla-panel-v1/a1-connection-frontier/test_yolla_panel_connection_frontier.cjs'
      - 'yolla-panel-v1/a1-connection-frontier/test_yolla_chrome_group_management_v1.cjs'
      - '.github/workflows/a0-apply-yolla-chrome-group-tabs-v53.yml'
  pull_request:
    branches:
      - integration/a1-yolla-panel-connection-frontier-v1
    paths:
      - 'yolla-panel-v1/a0-successor-control/ui-v53/yolla_panel_main_bridge.cjs.gz.b64'
      - 'yolla-panel-v1/a1-connection-frontier/**'
      - '.github/workflows/a0-apply-yolla-chrome-group-tabs-v53.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ui-v53:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: yolla-panel-v1/a1-connection-frontier
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            yolla-panel-v1/a1-connection-frontier
            yolla-panel-v1/a0-successor-control/ui-v53/yolla_panel_main_bridge.cjs.gz.b64
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check yolla_panel_main_bridge.cjs
          node --check yolla_worker_preload.js
          node --check yolla_worker_shell.js
          node --check test_yolla_panel_connection_frontier.cjs
          node --check test_yolla_chrome_group_management_v1.cjs
      - name: Validate compressed backend authority
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto=require('node:crypto');
          const fs=require('node:fs');
          const zlib=require('node:zlib');
          const source='../a0-successor-control/ui-v53/yolla_panel_main_bridge.cjs.gz.b64';
          const body=zlib.gunzipSync(Buffer.from(fs.readFileSync(source,'utf8').replace(/\s+/g,''),'base64'));
          const sha=crypto.createHash('sha256').update(body).digest('hex');
          if(sha!=='83c986e13256139fa02de66bc8e51cc110b8375404791c43f38dd00229574fdb') throw new Error('BACKEND_SHA256_MISMATCH:'+sha);
          console.log('UI_V53_BACKEND_SHA256=PASS');
          NODE
      - name: Run command-cycle regression
        shell: bash
        run: node test_yolla_panel_connection_frontier.cjs
      - name: Run group management tests
        shell: bash
        run: node test_yolla_chrome_group_management_v1.cjs
      - name: Record feature and safety boundary
        shell: bash
        run: |
          printf '%s\n' \
            'CHROME_GROUP_TABS=true' \
            'GROUP_RENAME=true' \
            'GROUP_COLOR=true' \
            'DYNAMIC_WORKER_ADD=true' \
            'CUSTOMIZATION_PERSISTENCE=true' \
            'NEW_ELECTRON_RUNTIME_COUNT=0' \
            'NEW_BROWSER_RUNTIME_COUNT=0' \
            'NEW_PROMPT_TRANSPORT_COUNT=0' \
            'TARGET_PC_EXECUTION_COUNT=0' \
            'PRODUCTION=false' \
            'READY=false' \
            'MERGE=false'

name: A5 Runtime Static Audit Extract

on:
  push:
    branches:
      - worker/a5-request-response-schema-v1
    paths:
      - .github/workflows/a5-runtime-static-audit-extract.yml

permissions:
  contents: read

jobs:
  extract-static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch and authority history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract authoritative runtime sources
        shell: bash
        run: |
          set -euo pipefail
          AUTHORITY_SHA="90403b02872f6449f17bd62929fc4e2357325329"
          ROOT="/tmp/a5-runtime-static-audit"
          mkdir -p "$ROOT/source-zip"

          git show "${AUTHORITY_SHA}:yolla-panel-v1/a0-successor-control/ui-v53/yolla_panel_main_bridge.cjs.gz.b64" \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            | gzip --decompress --stdout \
            > "$ROOT/yolla_panel_main_bridge.cjs"

          git show "${AUTHORITY_SHA}:yolla-panel-v1/a0-successor-control/ui-v53/YOLLA_CHROME_GROUP_TABS_DYNAMIC_WORKERS_SOURCE_V1.zip" \
            > "$ROOT/source.zip"
          unzip -q -o "$ROOT/source.zip" -d "$ROOT/source-zip"

          git show "${AUTHORITY_SHA}:yolla-panel-v1/a1-connection-frontier/yolla_worker_shell.js" \
            > "$ROOT/yolla_worker_shell.js"
          git show "${AUTHORITY_SHA}:yolla-panel-v1/a1-connection-frontier/yolla_worker_preload.js" \
            > "$ROOT/yolla_worker_preload.js"

          sha256sum "$ROOT/yolla_panel_main_bridge.cjs" "$ROOT/source.zip" > "$ROOT/input-sha256.txt"
          find "$ROOT/source-zip" -type f -printf '%P\n' | sort > "$ROOT/source-zip-file-list.txt"

      - name: Run A5 lifecycle polling render scanner
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/a5-runtime-static-audit"
          node yolla-panel-v1/v1-existing-runtime-control/workers/a5/A5_RUNTIME_STATIC_AUDIT_EXTRACTOR_V1.cjs \
            "$ROOT/yolla_panel_main_bridge.cjs" \
            "$ROOT/source-zip" \
            "$ROOT/yolla_worker_shell.js" \
            "$ROOT/yolla_worker_preload.js" \
            > "$ROOT/A5_RUNTIME_STATIC_AUDIT_RAW_SCAN_V1.json"
          node -e 'const fs=require("fs"); const p=process.argv[1]; const r=JSON.parse(fs.readFileSync(p,"utf8")); console.log(JSON.stringify({file_count:r.file_count,total_line_count:r.total_line_count,counts:r.counts,truncation:r.truncation},null,2));' \
            "$ROOT/A5_RUNTIME_STATIC_AUDIT_RAW_SCAN_V1.json"

      - name: Upload static audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: a5-runtime-static-audit-evidence
          path: |
            /tmp/a5-runtime-static-audit/A5_RUNTIME_STATIC_AUDIT_RAW_SCAN_V1.json
            /tmp/a5-runtime-static-audit/input-sha256.txt
            /tmp/a5-runtime-static-audit/source-zip-file-list.txt
          if-no-files-found: error
          retention-days: 7

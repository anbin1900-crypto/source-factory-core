name: A1 R7 B1 Support Runner Gate

on:
  pull_request:
    paths:
      - 'integrations/pc_agent_v1/R7_B1_RUNTIME_SUPPORT_EXECUTION_SOURCE.ps1'
      - 'integrations/pc_agent_v1/attempt_ledgers/A1_R6_TARGET_PC_SAFE_FAIL_B1_NATIVE_STDERR_V1_20260801.json'
      - '.github/workflows/a1-r7-b1-support-runner-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-r7-b1-policy:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            integrations/pc_agent_v1/R7_B1_RUNTIME_SUPPORT_EXECUTION_SOURCE.ps1
            integrations/pc_agent_v1/attempt_ledgers/A1_R6_TARGET_PC_SAFE_FAIL_B1_NATIVE_STDERR_V1_20260801.json
            .github/workflows/a1-r7-b1-support-runner-gate.yml
          sparse-checkout-cone-mode: false

      - name: Parse R7 PowerShell source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='integrations/pc_agent_v1/R7_B1_RUNTIME_SUPPORT_EXECUTION_SOURCE.ps1'
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count-ne0){throw ("POWERSHELL_PARSE_FAILED: " + $errors[0].Message)}
          'R7_POWERSHELL_PARSE=PASS'

      - name: Validate R7 blocking and nonblocking policy
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $file='integrations/pc_agent_v1/R7_B1_RUNTIME_SUPPORT_EXECUTION_SOURCE.ps1'
          $text=Get-Content -LiteralPath $file -Raw
          $required=@(
            'function Invoke-CapturedProcess',
            'B1_ARCHIVE_IDENTITY=PASS',
            'B1_RUNTIME_SUPPORT_MATERIALIZATION=PASS',
            'SFPADB2_B1_MATERIALIZATION_FAILED',
            'B1_RUNTIME_SUPPORT_SMOKE_NONBLOCKING_FAIL',
            "B1_SUPPORT_BLOCKING=false",
            "a1_support_blocking = false",
            'CONTINUE_A1_INTEGRATION_WITH_A1_NATIVE_RUNNER_AND_PRESERVE_B1_LOGS'
          )
          foreach($token in $required){
            if(-not $text.Contains($token)){throw ('R7_REQUIRED_TOKEN_MISSING=' + $token)}
          }
          if($text.Contains('$b1Output = & $PythonExe')){throw 'R7_DIRECT_NATIVE_STDERR_PATH_STILL_PRESENT'}
          'R7_B1_ARCHIVE_MATERIALIZATION_BLOCKING=PASS'
          'R7_B1_SMOKE_NONBLOCKING=PASS'
          'R7_NATIVE_STDERR_CAPTURE=PASS'

      - name: Validate R6 safe-fail ledger
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='integrations/pc_agent_v1/attempt_ledgers/A1_R6_TARGET_PC_SAFE_FAIL_B1_NATIVE_STDERR_V1_20260801.json'
          $ledger=Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          if($ledger.status-ne'SAFE_FAIL_BEFORE_WORKING_COPY_AND_ACTIVE_CORE_MUTATION'){throw 'R6_STATUS_INVALID'}
          if($ledger.b1_authority_boundary.pointer_declares_a1_support_blocking-ne$false){throw 'B1_SUPPORT_BOUNDARY_INVALID'}
          foreach($name in @(
            'working_copy_apply_count',
            'active_core_mutation_count',
            'pc_agent_execution_count',
            'api_fixture_execution_count',
            'database_fixture_write_count',
            'production_connection_count',
            'ready_transition_count',
            'merge_count'
          )){
            if([int]$ledger.safety_counters.$name-ne0){throw ('NONZERO_SAFETY_COUNTER=' + $name)}
          }
          'R6_SAFE_FAIL_LEDGER=PASS'
          'SAFETY_COUNTERS=ALL_ZERO'

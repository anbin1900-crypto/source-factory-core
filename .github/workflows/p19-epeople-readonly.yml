name: p19-epeople-readonly

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p19-epeople-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe 국민신문고 search results and detail pages (read only)
        run: python tools/p19_epeople_search_probe.py
      - name: Show search probe summary
        if: always()
        run: python -c "from pathlib import Path; print('\\n'.join(f'{p} {p.stat().st_size} bytes' for p in sorted(Path('p19_search_probe_out').glob('*')))); print(Path('p19_search_probe_out/search_probe.json').read_text(encoding='utf-8') if Path('p19_search_probe_out/search_probe.json').exists() else 'NO_FINAL_JSON')"
      - name: Upload search probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p19-epeople-search-probe-${{ matrix.os }}
          path: p19_search_probe_out
          if-no-files-found: warn
          retention-days: 1

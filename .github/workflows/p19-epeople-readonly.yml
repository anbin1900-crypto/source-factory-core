name: p19-epeople-readonly

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p19-epeople-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  harvest-rows:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Harvest targeted 국민신문고 public result rows (read only)
        run: python tools/p19_epeople_harvest_rows.py
      - name: Show harvest summary
        if: always()
        run: python -c "from pathlib import Path; import json; p=Path('p19_harvest_rows_out/harvest.json'); print('FILES'); print('\\n'.join(f'{x} {x.stat().st_size} bytes' for x in sorted(Path('p19_harvest_rows_out').glob('*')))); d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}; print('UNIQUE_ROWS',len(d.get('unique_rows',[]))); print('KEYWORDS', {k:v.get('total') for k,v in d.get('keywords',{}).items()})"
      - name: Upload row harvest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p19-epeople-harvest-rows
          path: p19_harvest_rows_out
          if-no-files-found: warn
          retention-days: 1

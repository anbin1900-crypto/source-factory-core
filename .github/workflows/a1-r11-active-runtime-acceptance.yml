name: A1 R11 Active Runtime Acceptance

on:
  pull_request:
    paths:
      - 'integrations/pc_agent_v1/pc_agent_bridge_worker.py'
      - 'integrations/runtime_acceptance_v1/**'
      - 'releases/SF_REUSABLE_CORE_20260801_175708/src/shared/stage4/pcAgentBridgeAdapter.js'
      - '.github/workflows/a1-r11-active-runtime-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-r11-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            integrations/pc_agent_v1/pc_agent_bridge_worker.py
            integrations/runtime_acceptance_v1
            releases/SF_REUSABLE_CORE_20260801_175708/src/shared/stage4/pcAgentBridgeAdapter.js
          sparse-checkout-cone-mode: false

      - name: Parse and compile R11 sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          contract=Path('integrations/runtime_acceptance_v1/R11_ACTIVE_RUNTIME_ACCEPTANCE_CONTRACT_V1.json')
          data=json.loads(contract.read_text(encoding='utf-8'))
          assert data['schema_version']=='YOLLA_A1_R11_ACTIVE_RUNTIME_ACCEPTANCE_CONTRACT_V1'
          assert data['safety_boundary']['production_connection'] is False
          assert data['safety_boundary']['ready'] is False
          assert data['safety_boundary']['merge'] is False
          print('R11_CONTRACT_JSON=PASS')
          PY
          python -m py_compile \
            integrations/pc_agent_v1/pc_agent_bridge_worker.py \
            integrations/runtime_acceptance_v1/test_r11_runtime_acceptance.py \
            integrations/runtime_acceptance_v1/validate_r11_runtime_acceptance.py
          node --check integrations/runtime_acceptance_v1/testLiveActiveCoreStage4HandlerBridgeV1.js
          echo R11_SOURCE_PARSE=PASS

      - name: Validate R11 package contract
        shell: bash
        run: |
          set -euo pipefail
          python integrations/runtime_acceptance_v1/validate_r11_runtime_acceptance.py \
            --package-root . \
            --output /tmp/r11-validation.json
          cat /tmp/r11-validation.json

      - name: Run worker lifecycle, singleton, duplicate and recovery tests
        shell: bash
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python integrations/runtime_acceptance_v1/test_r11_runtime_acceptance.py \
            --package-root . \
            --output /tmp/r11-runtime-ci.json
          cat /tmp/r11-runtime-ci.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/r11-runtime-ci.json',encoding='utf-8'))
          checks=result['checks']
          assert result['status']=='PASS'
          assert checks['worker_start'] is True
          assert checks['singleton_lock'] is True
          assert checks['singleton_exit_code']==73
          assert checks['basic_execution'] is True
          assert checks['duplicate_suppression'] is True
          assert checks['live_handler_external_worker'] is True
          assert checks['graceful_stop'] is True
          assert checks['processing_recovery'] is True
          assert result['production'] is False
          assert result['ready'] is False
          assert result['merge'] is False
          print('R11_RUNTIME_CI=PASS')
          PY

      - name: Record Linux safety boundary
        shell: bash
        run: |
          printf '%s\n' \
            'REAL_API_CALL_COUNT=0' \
            'POSTGRESQL_APPLY_COUNT=0' \
            'TARGET_PC_ACTIVE_RUNTIME_EXECUTION_COUNT=0' \
            'PRODUCTION=false' \
            'READY=false' \
            'MERGE=false'

  validate-r11-windows-powershell-51:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            integrations/pc_agent_v1/pc_agent_bridge_worker.py
            integrations/runtime_acceptance_v1
            releases/SF_REUSABLE_CORE_20260801_175708/src/shared/stage4/pcAgentBridgeAdapter.js
          sparse-checkout-cone-mode: false

      - name: Parse R11 runner with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(
            $PSVersionTable.PSEdition-ne'Desktop'-or
            $PSVersionTable.PSVersion.Major-ne5-or
            $PSVersionTable.PSVersion.Minor-ne1
          ){
            throw ('WINDOWS_POWERSHELL_51_REQUIRED actual=' + $PSVersionTable.PSVersion)
          }
          $files=@(
            'integrations/runtime_acceptance_v1/R11RuntimeCommon.ps1',
            'integrations/runtime_acceptance_v1/R11RuntimeTests.ps1',
            'integrations/runtime_acceptance_v1/Invoke-R11ActiveRuntimeAcceptance.ps1'
          )
          foreach($file in $files){
            $tokens=$null
            $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,[ref]$tokens,[ref]$errors
            )|Out-Null
            if($errors.Count-ne0){
              throw ('R11_POWERSHELL_PARSE_FAILED file=' + $file + ' error=' + $errors[0].Message)
            }
          }
          'WINDOWS_POWERSHELL_51_PARSE=PASS_3_OF_3'

      - name: Run R11 runtime tests on Windows
        shell: powershell
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile `
            integrations/pc_agent_v1/pc_agent_bridge_worker.py `
            integrations/runtime_acceptance_v1/test_r11_runtime_acceptance.py `
            integrations/runtime_acceptance_v1/validate_r11_runtime_acceptance.py
          if($LASTEXITCODE-ne0){throw 'R11_PYTHON_COMPILE_FAILED'}
          node --check integrations/runtime_acceptance_v1/testLiveActiveCoreStage4HandlerBridgeV1.js
          if($LASTEXITCODE-ne0){throw 'R11_NODE_CHECK_FAILED'}
          python integrations/runtime_acceptance_v1/validate_r11_runtime_acceptance.py `
            --package-root . `
            --output "$env:RUNNER_TEMP\r11-validation.json"
          if($LASTEXITCODE-ne0){throw 'R11_VALIDATOR_FAILED'}
          python integrations/runtime_acceptance_v1/test_r11_runtime_acceptance.py `
            --package-root . `
            --output "$env:RUNNER_TEMP\r11-runtime-ci.json"
          if($LASTEXITCODE-ne0){throw 'R11_RUNTIME_TEST_FAILED'}
          $result=Get-Content -LiteralPath "$env:RUNNER_TEMP\r11-runtime-ci.json" -Raw|ConvertFrom-Json
          if($result.status-ne'PASS'){throw 'R11_RUNTIME_RECEIPT_NOT_PASS'}
          if($result.checks.singleton_exit_code-ne73){throw 'R11_SINGLETON_EXIT_INVALID'}
          if($result.checks.processing_recovery-ne$true){throw 'R11_RECOVERY_NOT_PASS'}
          'R11_WINDOWS_RUNTIME_CI=PASS'
          'TARGET_PC_ACTIVE_RUNTIME_EXECUTION_COUNT=0'
          'REAL_API_CALL_COUNT=0'
          'POSTGRESQL_APPLY_COUNT=0'
          'PRODUCTION=false'
          'READY=false'
          'MERGE=false'
